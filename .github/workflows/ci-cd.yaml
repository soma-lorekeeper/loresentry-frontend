name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "197179613039"

  S3_BUCKET: loresentry-web-prod-197179613039
  CLOUDFRONT_DISTRIBUTION_ID: E3L6QXQGVEJTYQ

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build the Korean and English editions
        run: pnpm check:cdn

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # 한국어판과 영어판은 /ko/, /en/ 아래에 따로 둔다. CloudFront 함수가 보는 사람마다 하나를 고른다
      # (docs/deploy/cloudfront-rewrite.js, docs/deploy/README.md).
      - name: Upload fingerprinted assets
        run: |
          for locale in ko en; do
            aws s3 sync "dist/$locale/_next/" "s3://$S3_BUCKET/$locale/_next/" \
              --cache-control "public,max-age=31536000,immutable" \
              --only-show-errors
          done

      - name: Upload HTML and remove stale objects
        run: |
          for locale in ko en; do
            aws s3 sync "dist/$locale/" "s3://$S3_BUCKET/$locale/" --delete \
              --exclude "_next/*" --exclude "config.json" \
              --cache-control "public,max-age=60,must-revalidate" \
              --only-show-errors
          done
          # 버킷 맨 위는 언어를 고르는 함수를 켜기 전까지 쓰이는 자리이자 오류 페이지(/404.html)를 찾는
          # 자리다. 한국어판을 그대로 둔다. /ko/, /en/ 아래와 예전 자산은 지우지 않는다.
          aws s3 sync dist/ko/ "s3://$S3_BUCKET/" --delete \
            --exclude "_next/*" --exclude "config.json" \
            --exclude "ko/*" --exclude "en/*" \
            --cache-control "public,max-age=60,must-revalidate" \
            --only-show-errors

      - name: Upload runtime config
        run: |
          for prefix in "" "ko/" "en/"; do
            aws s3 cp dist/ko/config.json "s3://$S3_BUCKET/${prefix}config.json" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type application/json \
              --only-show-errors
          done

      - name: Invalidate the CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          echo "Invalidation: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
